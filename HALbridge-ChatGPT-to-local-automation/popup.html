<!-- popup.html – UI konfiguracji rozszerzenia HalBridge --><!DOCTYPE html><html>
<head>
  <meta charset="utf-8">
  <title>HalBridge Ustawienia</title>
  <style>
    body { font-family: sans-serif; padding: 10px; }
    label { display: block; margin-top: 8px; }
    input[type=text] { width: 100%; }
  </style>
</head>
<body>
  <h3>⚙️ Ustawienia HalBridge</h3>
  <label>Token API:
    <input type="text" id="token">
  </label>
  <label>
    <input type="checkbox" id="autoRun"> Tryb automatyczny (bez kliknięć)
  </label>
  <label>
    <input type="checkbox" id="debug"> Tryb debugowania (logi w konsoli)
  </label>
  <button id="saveBtn">💾 Zapisz</button>  <script src="popup.js"></script></body>
</html>
